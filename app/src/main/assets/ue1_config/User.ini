; UNREAL_ANDROID_SINGLE_INI_V148
; This port keeps ALL engine configuration in Unreal.ini (the DefaultIni the engine loads AND saves,
; with Filename=NULL). User.ini is NOT read for game config here — the engine's first-run logic just
; wants the file to exist. It intentionally carries no bindings/player/options: those live only in
; Unreal.ini, so there is a single source of truth and nothing to keep in sync.
;
; Do NOT re-add [Engine.Input] / [DefaultPlayer] here — they would be dead weight (never loaded) and a
; drift trap. Edit Unreal.ini instead.
